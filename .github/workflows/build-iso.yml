name: Build ISO

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "iso/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:
    inputs:
      edition:
        type: choice
        description: "Edition to build"
        options:
          - full
          - lite
        default: full

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            bash live-build live-config debootstrap cpio xorriso isolinux \
            squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            coreutils curl ca-certificates grep jq

      - name: Select edition
        run: |
          EDITION="${{ github.event.inputs.edition || 'full' }}"
          echo "Building edition: $EDITION"
          if [ "$EDITION" = "full" ]; then
            echo "WITH_OLLAMA=1" >> "$GITHUB_ENV"
            echo "WITH_MODEL=1" >> "$GITHUB_ENV"
          else
            echo "WITH_OLLAMA=0" >> "$GITHUB_ENV"
            echo "WITH_MODEL=0" >> "$GITHUB_ENV"
          fi
          echo "EDITION=$EDITION" >> "$GITHUB_ENV"

      - name: Build Origo ISO
        id: build
        continue-on-error: true
        working-directory: iso
        env:
          MIRROR: http://deb.debian.org/debian
          SECURITY_MIRROR: http://deb.debian.org/debian-security
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee "${GITHUB_WORKSPACE}/origo-build.log"

      - name: Diagnose failure
        if: steps.build.outcome == 'failure'
        run: |
          LOG="${GITHUB_WORKSPACE}/origo-build.log"
          echo "::group::build output (tail)"
          tail -n 150 "$LOG" 2>/dev/null || echo "no build output log"
          echo "::endgroup::"
          {
            grep -hoE 'E: .*|Error: .*|error: .*|No such .*|cannot .*|Invalid .*|unrecognized .*|not found.*|.*Failed.*|.*failed.*' \
              "$LOG" 2>/dev/null | tail -25
            echo "----- last 25 lines -----"
            tail -n 25 "$LOG" 2>/dev/null
          } | grep -vE '^[[:space:]]*$' | tail -40 | \
            while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            origo-build.log
            iso/build/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage ISO (split the full edition for release)
        if: steps.build.outcome == 'success'
        run: |
          set -euxo pipefail
          ISO=$(ls iso/build/*.iso | head -1)
          du -h "$ISO"
          mkdir -p release artifact
          if [ "${EDITION}" = "full" ]; then
            BASE="origo-v0.1-full-amd64"
          else
            BASE="origo-v0.1-amd64"
          fi
          cp "$ISO" "artifact/${BASE}.iso"
          ( cd artifact && sha256sum "${BASE}.iso" > "${BASE}.iso.sha256" )
          cp "artifact/${BASE}.iso.sha256" release/
          if [ "${EDITION}" = "full" ]; then
            # Each release asset must be <2 GiB; split at 1900 MiB.
            split -d -b 1900M "artifact/${BASE}.iso" "release/${BASE}.part"
            cp scripts/merge-iso.bat release/
            cp scripts/merge-iso.sh release/
            chmod +x release/merge-iso.sh
          else
            cp "artifact/${BASE}.iso" release/
          fi
          echo "=== release/ ==="
          ls -lh release

      - name: Upload ISO artifact (whole image)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EDITION == 'full' && 'origo-v0.1-full-amd64' || 'origo-v0.1-amd64' }}
          path: artifact/*
          retention-days: 30
          compression-level: 0

      - name: Delete existing release (clean slate)
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          API="https://api.github.com/repos/${REPO}/releases"
          REL=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" "${API}/tags/v0.1" || true)
          if [ -n "$REL" ]; then
            REL_ID=$(echo "$REL" | jq -r '.id')
            echo "Deleting release ${REL_ID} for a clean slate"
            curl -fsS -X DELETE -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" "${API}/${REL_ID}"
          fi

      - name: Publish rolling v0.1 release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1
          name: "Origo v0.1 (rolling preview)"
          prerelease: true
          make_latest: false
          body: |
            # Origo 元启 OS · v0.1（rolling preview）
            意图即界面、Agent 取代 App 的 AI 原生极简操作系统。基于 Debian，开箱即用。

            ## 完整版（推荐，出厂内置本地模型 qwen3:1.7b，约 4.5 GB）
            1. 下载下面 3 个分卷：`origo-v0.1-full-amd64.part00`、`.part01`、`.part02`
            2. 下载 `merge-iso.bat`（Windows）或 `merge-iso.sh`（Linux/macOS），把它和 3 个分卷放在同一个文件夹
            3. Windows：双击 `merge-iso.bat`；Linux/macOS：`bash merge-iso.sh`
            4. 合并得到 `origo-v0.1-full-amd64.iso`，用 Ventoy / Rufus（dd 模式）制作启动盘，或在虚拟机启动
            5. 开机即自动进入桌面，无需登录；桌面或终端运行 `origo-agent` 即可使用本地模型（首次推理较慢，CPU 亦可运行）
            桌面“安装 Origo”图标可用 Calamares 安装到硬盘。

            校验：`.sha256` 文件为完整 ISO 的 SHA256（合并后校验）。
            精简版（无模型）可用 Actions 手动构建（workflow_dispatch 选 lite）。
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
