name: Build ISO

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "iso/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:
    inputs:
      with_ollama:
        description: "Build with Ollama runtime (1 = yes)"
        required: false
        default: "0"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build live-config debootstrap cpio xorriso isolinux \
            squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            curl ca-certificates grep

      - name: Build Origo ISO
        id: build
        continue-on-error: true
        working-directory: iso
        env:
          MIRROR: http://deb.debian.org/debian
          SECURITY_MIRROR: http://deb.debian.org/debian-security
          WITH_OLLAMA: ${{ github.event.inputs.with_ollama || '0' }}
        run: |
          sudo -E bash -x ./build.sh 2>&1 | sudo tee /tmp/origo-build.log
          # propagate the build script's real exit status
          sudo test -f /tmp/origo-status && sudo cat /tmp/origo-status || true
          exit ${PIPESTATUS[0]}

      - name: Diagnose failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "::group::/tmp/origo-build.log (tail)"
          sudo tail -n 150 /tmp/origo-build.log || true
          echo "::endgroup::"
          echo "::group::live-build build.log (tail)"
          sudo tail -n 150 iso/build/build.log 2>/dev/null || echo "no live-build build.log"
          echo "::endgroup::"
          echo "::group::key error lines"
          sudo grep -nE 'E: |Error:|error:|ERROR|unrecognized|unknown|not found|No such|cannot|Failed|failed|exit status|Invalid' \
            /tmp/origo-build.log iso/build/build.log 2>/dev/null | tail -60 || true
          echo "::endgroup::"
          # Surface up to 20 key error lines as annotations (visible on the run summary).
          sudo grep -hoE 'E: .*|Error: .*|error: .*|unrecognized .*|No such .*|cannot .*|Invalid .*|.*not found.*' \
            /tmp/origo-build.log iso/build/build.log 2>/dev/null | tail -20 | \
          while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/origo-build.log
            iso/build/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage ISO and checksum
        if: steps.build.outcome == 'success'
        run: |
          ISO=$(ls iso/build/*.iso | head -1)
          echo "Built: $ISO"
          du -h "$ISO"
          cp "$ISO" origo-v0.1-amd64.iso
          sha256sum origo-v0.1-amd64.iso | tee origo-v0.1-amd64.iso.sha256

      - name: Upload ISO artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: origo-v0.1-amd64
          path: |
            origo-v0.1-amd64.iso
            origo-v0.1-amd64.iso.sha256
          retention-days: 30
          compression-level: 0
