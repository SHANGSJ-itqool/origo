name: Build ISO

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "iso/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:
    inputs:
      with_ollama:
        description: "Build with Ollama runtime (1 = yes)"
        required: false
        default: "0"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build live-config debootstrap cpio xorriso isolinux \
            squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            curl ca-certificates grep

      - name: Build Origo ISO
        id: build
        continue-on-error: true
        working-directory: iso
        env:
          MIRROR: http://deb.debian.org/debian
          SECURITY_MIRROR: http://deb.debian.org/debian-security
          WITH_OLLAMA: ${{ github.event.inputs.with_ollama || '0' }}
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee "${GITHUB_WORKSPACE}/origo-build.log"

      - name: Diagnose failure
        if: steps.build.outcome == 'failure'
        run: |
          LOG="${GITHUB_WORKSPACE}/origo-build.log"
          echo "::group::build output (tail)"
          tail -n 150 "$LOG" 2>/dev/null || echo "no build output log"
          echo "::endgroup::"
          {
            grep -hoE 'E: .*|Error: .*|error: .*|No such .*|cannot .*|Invalid .*|unrecognized .*|not found.*|.*Failed.*|.*failed.*' \
              "$LOG" 2>/dev/null | tail -25
            echo "----- last 25 lines -----"
            tail -n 25 "$LOG" 2>/dev/null
          } | grep -vE '^[[:space:]]*$' | tail -40 | \
          while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            origo-build.log
            iso/build/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage ISO and checksum
        if: steps.build.outcome == 'success'
        run: |
          ISO=$(ls iso/build/*.iso | head -1)
          echo "Built: $ISO"
          du -h "$ISO"
          cp "$ISO" origo-v0.1-amd64.iso
          sha256sum origo-v0.1-amd64.iso | tee origo-v0.1-amd64.iso.sha256

      - name: Upload ISO artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: origo-v0.1-amd64
          path: |
            origo-v0.1-amd64.iso
            origo-v0.1-amd64.iso.sha256
          retention-days: 30
          compression-level: 0

      - name: Publish rolling v0.1 release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1
          name: "Origo v0.1 (rolling preview)"
          prerelease: true
          make_latest: false
          files: |
            origo-v0.1-amd64.iso
            origo-v0.1-amd64.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
